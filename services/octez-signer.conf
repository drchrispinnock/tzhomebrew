# Configuration for the octez-signer service (brew services start octez-signer)
# This file is sourced by a shell script. The service serves HTTP only; for
# anything else, run octez-signer yourself.

# Base directory holding the signer's keys
DATADIR="$HOME/.tezos-signer"

# Address and port to listen on. To serve other machines use 0.0.0.0, and
# restrict access with a firewall.
ADDRESS="127.0.0.1"
#ADDRESS="0.0.0.0"
PORT="6732"

# High watermark check (double baking protection)
HWM_CHECK=""
#HWM_CHECK="-W"

# Restrict the signer to the following types. The default is to sign
# everything, which may not be what you want in production. Prefix with -M.
#
# Legacy block              0x01
# Legacy endorsement        0x02
# Transfer                  0x03
# Authenticated request     0x04
# Michelson data            0x05
# Block                     0x11
# Preattestation            0x12
# Attestation               0x13
MAGIC_BYTES=""

# For baking and attesting you might want
#MAGIC_BYTES="-M 0x11,0x12,0x13"
#HWM_CHECK="-W"

# Other options to pass to the signer
RUNTIME_OPTS=""

# Log rules (TEZOS_LOG syntax, e.g. "warning" or "notice")
# for the service log in $(brew --prefix)/var/log/octez, which is never
# rotated. Octez separately keeps 7 days of info-level logs in
# $DATADIR/logs/octez-signer.
# Set to "" for the Octez default (notice).
LOG_RULES="warning"
