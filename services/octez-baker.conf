# Configuration for the octez-baker service (brew services start octez-baker)
# This file is sourced by a shell script.

# Baking mode:
#   local  - bake against a node on this machine, reading its data directory
#   remote - bake against a node's RPC endpoint (ENDPOINT below)
MODE="local"

# Node data directory (local mode)
DATADIR="$HOME/.tezos-node"

# Node RPC endpoint (remote mode)
ENDPOINT="http://127.0.0.1:8732"

# Where the Tezos wallet files are stored
CLIENTDIR="$HOME/.tezos-client"

# Keys to bake with (if empty, try to bake with all in the wallet)
KEYS=""

# To use DAL, install octez-dal-node, configure it and point at it.
DAL_OPTIONS="--without-dal"
#DAL_OPTIONS="--dal-node http://127.0.0.1:10732"

# Liquidity baking toggle vote: on, off or pass.
# This must be set and is your decision.
#LQ_VOTE="pass"

# Other options to pass to the baker
RUNTIME_OPTS=""

# Log rules (TEZOS_LOG syntax, e.g. "warning" or "notice")
# for the service log in $(brew --prefix)/var/log/octez, which is never
# rotated. Octez separately keeps 7 days of info-level logs in
# $CLIENTDIR/logs/octez-baker.
# Set to "" for the Octez default (notice).
LOG_RULES="warning"
