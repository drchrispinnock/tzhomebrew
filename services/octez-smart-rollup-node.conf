# Configuration for the octez-smart-rollup-node service
# (brew services start octez-smart-rollup-node)
# This file is sourced by a shell script.

# Data directory
DATADIR="$HOME/.tezos-smart-rollup-node"

# Where the Octez wallet (operator keys) is stored
CLIENTDIR="$HOME/.tezos-client"

# Other options to pass to the rollup node
RUNTIME_OPTS=""

# Log rules (TEZOS_LOG syntax, e.g. "warning" or "notice")
# for the service log in $(brew --prefix)/var/log/octez, which is never
# rotated. Octez separately keeps 7 days of info-level logs in
# $DATADIR/daily_logs.
# Set to "" for the Octez default (notice).
LOG_RULES="warning"
