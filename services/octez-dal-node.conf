# Configuration for the octez-dal-node service (brew services start octez-dal-node)
# This file is sourced by a shell script.

# Data directory
DATADIR="$HOME/.tezos-dal-node"

# Other options to pass to the DAL node
RUNTIME_OPTS=""
# For example, if your node is elsewhere:
#RUNTIME_OPTS="--endpoint=http://mynode.local:8732"

# Log rules (TEZOS_LOG syntax, e.g. "warning" or "notice")
# for the service log in $(brew --prefix)/var/log/octez, which is never
# rotated. Octez separately keeps 7 days of info-level logs in
# $DATADIR/daily_logs.
# Set to "" for the Octez default (notice).
LOG_RULES="warning"
