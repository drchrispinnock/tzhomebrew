# Configuration for the octez-evm-node service (brew services start octez-evm-node)
# This file is sourced by a shell script. The service runs an observer; for a
# sequencer or other modes, run octez-evm-node yourself.

# Data directory
DATADIR="$HOME/.octez-evm-node"

# JSON-RPC address and port. To serve other machines use 0.0.0.0.
RPCADDR="127.0.0.1"
#RPCADDR="0.0.0.0"
RPCPORT="8545"

# Smart rollup node to follow
ENDPOINT="http://127.0.0.1:8932"

# Other options to pass to the EVM node
RUNTIME_OPTS=""
# For example, for a fresh data directory on mainnet:
#RUNTIME_OPTS="--network mainnet --init-from-snapshot"

# Log rules (TEZOS_LOG syntax, e.g. "warning" or "notice")
# for the service log in $(brew --prefix)/var/log/octez, which is never
# rotated. Octez separately keeps 7 days of info-level logs in
# $DATADIR/daily_logs.
# Set to "" for the Octez default (notice).
LOG_RULES="warning"
